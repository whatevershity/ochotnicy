<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SZKIC 1 — nie strona</title>
    <style>
      /*
        Szkic kompozycji wg polecenia.
        Naśladuje układ London Gallery Weekend: wszystko do środka.
        Tło ciepłobiałe, bez zdjęć.
      */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: #f3f0e8;
        color: #111;
        font-family: Georgia, "Times New Roman", serif;
        padding: 3rem 1.5rem;
      }
      .frame {
        width: min(42rem, 100%);
        display: grid;
        justify-items: center;
        text-align: center;
        gap: 0;
      }
      /* pierwszy napis + logo 30% ZA nim */
      .eyebrow {
        position: relative;
        display: grid;
        place-items: center;
        margin-bottom: 2.75rem;
        min-height: 5.5rem;
      }
      .eyebrow__logo {
        position: absolute;
        width: 4.75rem;
        height: 4.75rem;
        object-fit: contain;
        opacity: 0.3;
        z-index: 0;
        pointer-events: none;
      }
      .eyebrow__text {
        position: relative;
        z-index: 1;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #111;
      }
      .title {
        font-size: clamp(1.85rem, 5vw, 2.85rem);
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        line-height: 1.05;
        color: #111;
      }
      .rule {
        margin: 1.35rem 0 1.15rem;
        font-size: 1.1rem;
        line-height: 1;
        color: #111;
      }
      .red {
        color: #d94948;
        font-size: clamp(1.05rem, 2.2vw, 1.25rem);
        font-style: italic;
        font-weight: 400;
        max-width: 28rem;
        line-height: 1.35;
      }
      .note {
        margin-top: 1.15rem;
        font-size: 0.92rem;
        line-height: 1.55;
        color: #111;
        max-width: 28rem;
        font-style: normal;
      }
      .label {
        position: fixed;
        top: 0.75rem;
        left: 0.75rem;
        font-family: system-ui, sans-serif;
        font-size: 0.65rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #888;
      }
    </style>
  </head>
  <body>
    <p class="label">Szkic 1 · nie produkcja</p>
    <div class="frame">
      <div class="eyebrow">
        <img
          class="eyebrow__logo"
          src="./logo-mark.png"
          alt=""
        />
        <p class="eyebrow__text">Upowszechnianie wiedzy historycznej</p>
      </div>

      <h1 class="title">
        Stowarzyszenie<br />
        Ochotnicy Wolności
      </h1>

      <p class="rule" aria-hidden="true">—</p>

      <p class="red">Działamy na rzecz przywracania pamięci</p>

      <p class="note">
        — o osobach, organizacjach i ruchach wykluczonych z dominującej
        narracji historycznej
      </p>
    </div>
  </body>
</html>
